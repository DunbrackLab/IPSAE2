[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsae2"
version = "0.1.9"
description = "Directional ipSAE scores for biomolecular structure predictions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dunbrack Laboratory"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "gemmi>=0.6.7"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
ipsae = "ipsae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
